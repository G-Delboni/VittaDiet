<body>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <symbol id="ill-bowl" viewBox="0 0 120 120">
      <path class="fill-forest" d="M14 58h92a46 46 0 0 1-92 0z"/>

      <circle class="fill-soft" cx="64" cy="42" r="16"/>

      <circle class="fill-forest" cx="52" cy="36" r="6"/>

      <path class="fill-forest" d="M10 60h100a50 50 0 0 1-100 0z"/>
      <circle class="fill-leaf" cx="38" cy="48" r="15"/>
      <circle class="fill-soft" cx="64" cy="40" r="18"/>

      <circle class="fill-forest" cx="50" cy="34" r="6"/>

      <path class="fill-forest" d="M14 58h92a46 46 0 0 1-92 0z"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
