# ==============================================================================
# CONFIGURAÇÕES GLOBAIS
# ==============================================================================
spring:
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${DB_NAME}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: "classpath:db/migration"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

api:
  security:
    token:
      secret: "${SECRET}"

app:
  allowed-origin: "${APP_ALLOWED_ORIGIN:http://localhost:5173}"

---
# ==============================================================================
# PERFIL DE DESENVOLVIMENTO
# ==============================================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
