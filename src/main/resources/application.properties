# Server
server.port=8080
spring.config.import=optional:file:.env[.properties]
api.security.token.secret=${SECRET}
# Origem do front (Vite em dev). Em produção, a URL do Vercel.
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:5173}

# Errors
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration