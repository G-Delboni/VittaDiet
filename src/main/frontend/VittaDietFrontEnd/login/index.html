<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · VittaDiet</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/leaf.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Young+Serif&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base/tokens.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/typography.css">
  <link rel="stylesheet" href="/css/components/button.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/components/illustration.css">
  <link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <div class="auth">

    <aside class="auth__aside">
      <p class="auth__tagline">Comer bem pode ser simples, leve e acolhedor.</p>
      <svg class="illustration auth__art" viewBox="0 0 120 120" aria-hidden="true">
        <path class="fill-mint" d="M14 58h92a46 46 0 0 1-92 0z"/>
        <circle class="fill-leaf" cx="40" cy="48" r="14"/>
        <circle class="fill-soft" cx="64" cy="42" r="16"/>
        <circle class="fill-leaf" cx="86" cy="50" r="12"/>
        <circle class="fill-mint" cx="52" cy="36" r="6"/>
      </svg>
    </aside>

    <main class="auth__main" id="conteudo">
      <div class="auth__card">

        <a class="auth__brand" href="/">
          <img src="/assets/icons/leaf.svg" alt="" width="32" height="32">
          VittaDiet
        </a>

        <div class="tabs" role="tablist" aria-label="Acesso à conta">
          <button class="tabs__tab" type="button" role="tab" id="tab-login" aria-controls="painel-login" aria-selected="true">Entrar</button>
          <button class="tabs__tab" type="button" role="tab" id="tab-cadastro" aria-controls="painel-cadastro" aria-selected="false" tabindex="-1">Criar conta</button>
        </div>

        <!-- Painel: Entrar -->
        <section id="painel-login" role="tabpanel" aria-labelledby="tab-login">
          <h1 class="auth__title">Bem-vindo de volta</h1>
          <form class="form" id="form-login" novalidate>
            <div class="field">
              <label class="field__label" for="login-email">E-mail</label>
              <input class="field__input" id="login-email" name="email" type="email" autocomplete="email" required aria-describedby="erro-login-email">
              <p class="field__error" id="erro-login-email" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="login-senha">Senha</label>
              <input class="field__input" id="login-senha" name="password" type="password" autocomplete="current-password" required aria-describedby="erro-login-senha">
              <p class="field__error" id="erro-login-senha" hidden></p>
            </div>
            <p class="form-status" role="alert" data-status></p>
            <button class="btn btn--primary btn--block" type="submit">Entrar</button>
          </form>
        </section>

        <!-- Painel: Criar conta -->
        <section id="painel-cadastro" role="tabpanel" aria-labelledby="tab-cadastro" hidden>
          <h1 class="auth__title">Crie sua conta</h1>
          <form class="form" id="form-cadastro" novalidate>
            <div class="field">
              <label class="field__label" for="cadastro-nome">Nome</label>
              <input class="field__input" id="cadastro-nome" name="name" type="text" autocomplete="name" required aria-describedby="erro-cadastro-nome">
              <p class="field__error" id="erro-cadastro-nome" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="cadastro-email">E-mail</label>
              <input class="field__input" id="cadastro-email" name="email" type="email" autocomplete="email" required aria-describedby="erro-cadastro-email">
              <p class="field__error" id="erro-cadastro-email" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="cadastro-senha">Senha</label>
              <input class="field__input" id="cadastro-senha" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="erro-cadastro-senha">
              <p class="field__error" id="erro-cadastro-senha" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="cadastro-confirmar">Confirmar senha</label>
              <input class="field__input" id="cadastro-confirmar" name="passwordConfirmation" type="password" autocomplete="new-password" required aria-describedby="erro-cadastro-confirmar">
              <p class="field__error" id="erro-cadastro-confirmar" hidden></p>
            </div>
            <p class="form-status" role="alert" data-status></p>
            <button class="btn btn--primary btn--block" type="submit">Criar conta</button>
          </form>
        </section>

        <a class="auth__back" href="/">Voltar para o início</a>
      </div>
    </main>

  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
